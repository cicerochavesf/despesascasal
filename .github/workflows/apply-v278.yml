name: Aplicar V2.78 valor vazio em novo lancamento

"on":
  push:
    paths:
      - '.github/workflows/apply-v278.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deixar valor vazio em novo lancamento
        run: |
          echo '' | base64 -d > /tmp/patch_v278.py
          python3 /tmp/patch_v278.py
          rm -f .github/workflows/apply-v278.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v278.yml
          git commit -m "V2.78: novo lancamento inicia com valor vazio"
          git push
