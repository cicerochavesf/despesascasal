name: Corrigir markup V2.81
on:
  push:
    paths:
      - '.github/workflows/fix-v281-label.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<tlabel class="v281-period-field">'
          if old not in s:
              raise SystemExit('Markup a corrigir não encontrado')
          s=s.replace(old,'<label class="v281-period-field">',1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace('financas-cn-v240','financas-cn-v241',1)
          sw.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-v281-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: corrige seletor Ano e Mes da V2.81"
          git push
