name: Aplicar V2.49

on:
  push:
    paths:
      - '.github/workflows/apply-v249.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.48
        run: test "$(git hash-object index.html)" = "0fcb134df29fb07059a7077f53253e2e5a2cc163"
      - name: Aplicar V2.49
        shell: python
        run: |
          import base64, zlib, subprocess
          payload = ""
          patch = zlib.decompress(base64.b64decode(payload))
          open('/tmp/v249.patch','wb').write(patch)
          subprocess.run(['patch','-p1','-i','/tmp/v249.patch'], check=True)
      - name: Validar V2.49
        run: |
          test "$(git hash-object index.html)" = "a67ffd51f6b02b9f7868d1f157ef5d76539f5f36"
          grep -q 'versão 2.49' index.html
          grep -q 'Responsabilidade financeira' index.html
          grep -q 'Despesas por localidade' index.html
      - name: Publicar V2.49 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v249.yml
          git add index.html .github/workflows/apply-v249.yml
          git commit -m 'V2.49: adicionar responsabilidade e localidade no Início'
          git push origin HEAD:main
