name: Aplicar V2.50

on:
  push:
    paths:
      - '.github/workflows/apply-v250.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base publicada
        run: test "$(git hash-object index.html)" = "05a7cf107b0d5946fe21a4e50a847b3f34a3ae3f"
      - name: Aplicar V2.50
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_header='<!-- Despesas Casal - Controle Financeiro | versão 2.51 -->'
          new_header='<!-- Despesas Casal - Controle Financeiro | versão 2.50 -->'
          if old_header not in s:
              raise SystemExit('Cabeçalho V2.51 não encontrado')
          s=s.replace(old_header,new_header,1)

          old_quick="""function mobileQuickAction(){
            if(view==='rxd')return '';
            const planning=view==='despesas'||view==='receitas';
            const action=planning?'openPlanningQuickAction()':'openTx()';
            const label=planning?'Nova previsão':'Novo lançamento';
            return `<button class=\"v27-global-fab\" type=\"button\" onclick=\"${action}\" aria-label=\"${label}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg><span>${label}</span></button>`
          }"""
          new_quick="""function mobileQuickAction(){
            let action='',label='';
            if(view==='lancamentos'){
              if(txPanel==='remanejamentos'){action='openRealloc()';label='Novo remanejamento'}
              else{action='openTx()';label='Novo lançamento'}
            }else if(view==='despesas'||view==='receitas'){
              action='openPlanningQuickAction()';label='Nova previsão'
            }else return '';
            return `<button class=\"v27-global-fab\" type=\"button\" onclick=\"${action}\" aria-label=\"${label}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg><span>${label}</span></button>`
          }"""
          if old_quick not in s:
              raise SystemExit('mobileQuickAction original não encontrado')
          s=s.replace(old_quick,new_quick,1)

          old_rem='<div class="section-title"><div><h3>Remanejamentos — ${periodTitle}</h3><span>Transfira saldo somente dentro do acompanhamento. O orçamento original não será alterado.</span></div><button class="btn secondary" onclick="openRealloc()">Novo remanejamento</button></div>'
          new_rem='<div class="section-title"><div><h3>Remanejamentos — ${periodTitle}</h3><span>Transfira saldo somente dentro do acompanhamento. O orçamento original não será alterado.</span></div></div>'
          if old_rem not in s:
              raise SystemExit('Cabeçalho de remanejamentos original não encontrado')
          s=s.replace(old_rem,new_rem,1)

          old_head='layout(`<div class="head tx-head"><div><h2>Lançamentos</h2><p>Acompanhe o planejado, o realizado e os saldos sem perder espaço na tela.</p></div><div class="actions"><button class="btn" onclick="openTx()">Novo lançamento</button></div></div>'
          new_head='const txPrimaryAction=txPanel===\'remanejamentos\'?`<button class="btn" onclick="openRealloc()">Novo remanejamento</button>`:`<button class="btn" onclick="openTx()">Novo lançamento</button>`;\n  layout(`<div class="head tx-head"><div><h2>Lançamentos</h2><p>Acompanhe o planejado, o realizado e os saldos sem perder espaço na tela.</p></div><div class="actions">${txPrimaryAction}</div></div>'
          if old_head not in s:
              raise SystemExit('Ação principal de Movimentações não encontrada')
          s=s.replace(old_head,new_head,1)

          home_fix=r'''<style id="v250-home-fixes-style">
          /* V2.50 — correções finais do Início: distribuição sem rolagem interna e redimensionamento das tabelas no PC. */
          .v248-category-list{max-height:none!important;overflow:visible!important;overscroll-behavior:auto!important}
          .v248-category-body{height:auto!important;min-height:0!important}
          @media(min-width:761px){
            .v248-insights-grid{grid-template-columns:minmax(0,1.48fr) minmax(360px,1.05fr)}
            .v250-matrix-wrap.table-wrap{overflow:auto!important;max-width:100%}
            .v250-matrix-panel>.column-width-toolbar{display:none!important}
            .v250-matrix-wrap th.column-resizable{padding-right:13px!important}
          }
          @media(max-width:760px){
            .v248-category-list{max-height:none!important;overflow:visible!important}
          }
          </style>
          <script id="v250-home-fixes-script">
          (function(){
            /* 2026 no app começa em julho; o Início deve obedecer à mesma regra já usada no Planejamento/Análises. */
            const legacyHomeMonthsForYear=v246HomeMonthsForYear;
            v246HomeMonthsForYear=function(year){
              const y=String(year),allowedNumbers=(typeof v213MonthNumbersForYear==='function')?v213MonthNumbersForYear(y):(y==='2026'?[7,8,9,10,11,12]:Array.from({length:12},(_,i)=>i+1));
              const allowed=new Set(allowedNumbers.map(n=>String(n).padStart(2,'0')));
              return legacyHomeMonthsForYear(y).filter(month=>allowed.has(String(month).slice(5,7)));
            };

            /* Garantia extra: após o render do Início, registrar as tabelas no sistema global e instalar as alças de arraste no desktop. */
            const legacyPostRenderV75=postRenderV75;
            postRenderV75=function(){
              legacyPostRenderV75();
              const app=document.getElementById('app');
              if(view==='estrategia'&&app){
                requestAnimationFrame(()=>{
                  if(typeof initColumnWidthEditors==='function')initColumnWidthEditors(app);
                  if(typeof installColumnDragResizers==='function'&&(!window.matchMedia||window.matchMedia('(min-width:761px)').matches))installColumnDragResizers(app);
                });
              }
            };
          })();
          </script>
          <!-- V2.50 — Início: colunas redimensionáveis por arraste no PC; Distribuição por categoria sem rolagem interna; 2026 limitado a julho–dezembro. -->
          <!-- V2.50 — Ações contextuais: Novo lançamento somente em Movimentações; em Remanejamentos vira Novo remanejamento; Planejamento mantém Nova previsão. -->'''
          if 'v250-home-fixes-style' in s:
              raise SystemExit('Correções V2.50 já existem inesperadamente')
          s=s.replace('</body></html>',home_fix+'\n\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.50
        run: |
          grep -q 'versão 2.50' index.html
          grep -q "if(view==='lancamentos')" index.html
          grep -q "txPanel==='remanejamentos'" index.html
          grep -q "label='Novo remanejamento'" index.html
          grep -q "label='Nova previsão'" index.html
          grep -q 'v250-home-fixes-style' index.html
          grep -q "y==='2026'?\[7,8,9,10,11,12\]" index.html
          grep -q '.v248-category-list{max-height:none!important' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('function v250HomeMatrices') == 1
          assert "${v250Panel('cat'" in s and "${v250Panel('sub'" in s
          start=s.index('function v250HomeMatrices')
          frag=s[start:start+500]
          assert frag.index("v250Panel('cat'") < frag.index("v250Panel('sub'")
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/all-scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          print('scripts',len(scripts),'blob')
          PY
          node --check /tmp/all-scripts.js
          git hash-object index.html
      - name: Publicar V2.50 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v250.yml
          git add index.html .github/workflows/apply-v250.yml
          git commit -m 'V2.50: corrigir Início e ações contextuais'
          git push origin HEAD:main
