name: Aplicar V2.70

on:
  push:
    paths:
      - '.github/workflows/apply-v270.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.69
        run: test "$(git hash-object index.html)" = "8b40e4db62ca1730dbc8f74f6e7e8f511b372c24"

      - name: Aplicar V2.70
        env:
          V270_PATCH_GZ_B64: 