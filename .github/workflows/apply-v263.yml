name: Aplicar V2.63
on:
  push:
    paths:
      - '.github/workflows/apply-v263.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir base V2.62
        run: |
          test "$(git hash-object index.html)" = "2dcf23507015743ce25b7df45728a1e64104eac4"
      - name: Aplicar V2.63
        run: |
          python - <<'PY'
          import zlib,base64
          open('/tmp/patch.py','wb').write(zlib.decompress(base64.b64decode('')))
          PY
          python /tmp/patch.py
      - name: Validar V2.63
        run: |
          grep -q "versão 2.63" index.html
          grep -q "Total investido" index.html
          grep -q "V2.63 — Restaura o KPI Total investido" index.html
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          open('/tmp/all.js','w',encoding='utf-8').write(js)
          PY
          node --check /tmp/all.js
      - name: Publicar V2.63 e limpar workflow temporário
        run: |
          git config user.name "ChatGPT App Despesas Casal"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/apply-v263.yml
          git add index.html .github/workflows/apply-v263.yml
          git commit -m "V2.63: restaurar KPI total investido"
          git push
