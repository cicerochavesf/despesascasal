name: Aplicar V2.54
on:
  push:
    paths:
      - .github/workflows/apply-v254.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.53
        run: test "$(git hash-object index.html)" = "e54297bb86c3ec9f9e89e97a6053fe068d278c07"
      - name: Aplicar V2.54
        run: |
          echo '' | base64 --decode > /tmp/patch_v254.py
          python /tmp/patch_v254.py
      - name: Validar V2.54
        run: |
          grep -q 'versão 2.54' index.html
          grep -q 'v254ToggleSubcategoryMatrix' index.html
          grep -q 'v254-subcategory-collapse-style' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/all-scripts.js').write_text('\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/all-scripts.js
      - name: Publicar V2.54
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v254.yml
          git add index.html .github/workflows/apply-v254.yml
          git commit -m 'V2.54: recolher subcategorias no Início'
          git push origin HEAD:main
