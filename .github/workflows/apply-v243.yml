name: Aplicar V2.43

on:
  push:
    paths:
      - '.github/workflows/apply-v243.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar alterações da V2.43
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_version = '<!-- Despesas Casal - Controle Financeiro | versão 2.42 -->'
          new_version = '<!-- Despesas Casal - Controle Financeiro | versão 2.43 -->'
          if old_version not in s:
              raise SystemExit('Cabeçalho V2.42 não encontrado; publicação cancelada.')
          s = s.replace(old_version, new_version, 1)

          rhythm = '''    <section class="v23-panel v23-panel-pad v23-gap-top"><div class="v23-panel-head"><div><h2>Ritmo de gastos do mês</h2><p>Gasto acumulado comparado ao ritmo planejado em ${labelMonth(month)} de ${year}.</p></div><button class="v23-panel-link" onclick="view='lancamentos';txPanel='acompanhamento';txScope='mes';render()">Abrir planejado</button></div>${v214MonthRhythm(month,planned)}</section>\n'''
          if rhythm not in s:
              raise SystemExit('Bloco Ritmo de gastos não encontrado; publicação cancelada.')
          s = s.replace(rhythm, '', 1)

          start_marker = '    <div class="v23-grid equal v23-gap-top"><section class="v23-panel v23-panel-pad"><div class="v23-panel-head"><div><h2>Maiores despesas planejadas</h2>'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('Bloco Maiores despesas planejadas não encontrado; publicação cancelada.')
          recent_marker = '<section class="v23-panel v23-panel-pad"><div class="v23-panel-head"><div><h2>Movimentações recentes</h2>'
          recent_start = s.find(recent_marker, start)
          if recent_start < 0:
              raise SystemExit('Bloco Movimentações recentes não encontrado; publicação cancelada.')
          close_marker = '</section></div>'
          close = s.find(close_marker, recent_start)
          if close < 0:
              raise SystemExit('Fechamento do grid da tela Início não encontrado; publicação cancelada.')
          recent_end = close + len('</section>')
          grid_end = close + len(close_marker)
          recent = s[recent_start:recent_end]
          s = s[:start] + '    ' + recent + s[grid_end:]

          note = '<!-- V2.43 — Tela Início simplificada: removidos Ritmo de gastos do mês e Maiores despesas planejadas; Movimentações recentes permanece. -->'
          if note not in s:
              s = s.replace('\n</body></html>', '\n' + note + '\n\n</body></html>', 1)

          path.write_text(s, encoding='utf-8')
      - name: Validar alteração
        shell: bash
        run: |
          grep -q 'versão 2.43' index.html
          grep -q 'V2.43 — Tela Início simplificada' index.html
      - name: Publicar index.html
        shell: bash
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m 'V2.43: simplificar tela Início'
          git push origin HEAD:main
