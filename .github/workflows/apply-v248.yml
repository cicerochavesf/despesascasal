name: Aplicar V2.48

on:
  push:
    paths:
      - '.github/workflows/apply-v248.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.44
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "1f04a5fd124842c07bf724c9528fccd2bf0d7023"
      - name: Aplicar V2.48
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/v248.patch
          python - <<'PY'
from pathlib import Path
import base64
p=Path('/tmp/v248.patch')
# placeholder to be replaced by generated full patch at runtime is not allowed
PY
          git apply --check /tmp/v248.patch
          git apply /tmp/v248.patch
      - name: Validar arquivo final
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "0fcb134df29fb07059a7077f53253e2e5a2cc163"
          grep -q 'versão 2.48' index.html
          grep -q 'v248-home-insights-style' index.html
          grep -q 'Receitas × despesas planejadas — mês a mês' index.html
          grep -q 'Distribuição por categoria' index.html
      - name: Publicar V2.48 e limpar workflow temporário
        shell: bash
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v248.yml
          git add index.html .github/workflows/apply-v248.yml
          git commit -m 'V2.48: ampliar dashboard da tela Início'
          git push origin HEAD:main
