name: Apply V292 sticky abbrev
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v292-sticky-abbrev.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply V2.92
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.91 -->'
          if old not in t: raise SystemExit('V2.91 não encontrada')
          block=base64.b64decode('').decode('utf-8')
          if 'v292-planning-sticky-mobile-abbrev-style' not in t:
              t=t.replace('</body>',block+'\n</body>',1)
          t=t.replace(old,'<!-- Despesas Casal - Controle Financeiro | versão 2.92 -->',1)
          p.write_text(t,encoding='utf-8')
          sw=Path('sw.js'); s=sw.read_text(encoding='utf-8')
          if 'financas-cn-v254' not in s: raise SystemExit('cache v254 não encontrado')
          sw.write_text(s.replace('financas-cn-v254','financas-cn-v255',1),encoding='utf-8')
          Path('.github/workflows/apply-v292-sticky-abbrev.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v292-sticky-abbrev.yml
          git commit -m "V2.92: congela primeira coluna e abrevia subcategorias no mobile"
          git push origin main
