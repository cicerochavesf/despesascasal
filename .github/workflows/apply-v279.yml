name: Aplicar V2.79 padroes do novo lancamento

"on":
  push:
    paths:
      - '.github/workflows/apply-v279.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar data e forma de pagamento padrao
        run: |
          echo '' | base64 -d > /tmp/patch_v279.py
          python3 /tmp/patch_v279.py
          rm -f .github/workflows/apply-v279.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v279.yml
          git commit -m "V2.79: data atual e Debito Pix Noh no novo lancamento"
          git push
