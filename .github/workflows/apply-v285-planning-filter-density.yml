name: Apply V285 planning filter density
'on':
  push:
    paths:
      - .github/workflows/apply-v285-planning-filter-density.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact planning filters
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.84 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.85 -->'
          if old not in s:
              raise SystemExit('Versão 2.84 não encontrada')
          s=s.replace(old,new,1)
          marker='v285-planning-filter-density'
          if marker not in s:
              encoded=''
              block=base64.b64decode(encoded).decode('utf-8')
              s=s.replace('</head>',block+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r'financas-cn-v\d+','financas-cn-v248',t,count=1)
          sw.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v285-planning-filter-density.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.85: compacta filtros de despesas no Planejamento"
          git pull --rebase origin main
          git push
