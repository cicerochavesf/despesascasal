name: Aplicar V2.60

on:
  push:
    paths:
      - '.github/workflows/apply-v260.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.59
        run: test "$(git hash-object index.html)" = "2312e08f48f804909b56f9261d41dcc38b3ba275"
      - name: Aplicar V2.60
        shell: python
        run: |
          from pathlib import Path
          import zlib,base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.59 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.60 -->'
          if old not in s: raise SystemExit('Cabeçalho V2.59 não encontrado')
          if 'v260-analysis-clean-style' in s: raise SystemExit('V2.60 já aplicada')
          s=s.replace(old,new,1)
          payload=''
          block=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          if '</body></html>' not in s: raise SystemExit('Fechamento HTML não encontrado')
          s=s.replace('</body></html>',block+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.60
        run: |
          grep -q 'versão 2.60' index.html
          grep -q 'v260-analysis-clean-style' index.html
          grep -q 'Despesas por categoria — planejado com remanejamento' index.html
          grep -q 'Sugestões de melhoria' index.html
          grep -q 'v260SetCategoryMode' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/all-scripts.js').write_text('\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/all-scripts.js
      - name: Publicar V2.60 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v260.yml
          git add index.html .github/workflows/apply-v260.yml
          git commit -m 'V2.60: simplificar e refazer Análises'
          git push origin HEAD:main
