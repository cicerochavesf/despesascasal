name: Aplicar V2.61

on:
  push:
    paths:
      - '.github/workflows/apply-v261.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.60
        run: test "$(git hash-object index.html)" = "7507d85b678b2ebcff677a207f9856916f35b522"
      - name: Aplicar V2.61
        shell: python
        env:
          V261_PAYLOAD: 
        run: |
          from pathlib import Path
          import base64, gzip, os
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.60 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.61 -->'
          if old not in s:
              raise SystemExit('Cabeçalho V2.60 não encontrado')
          if 'v261-history-jan-jun-2026-script' in s:
              raise SystemExit('V2.61 já aplicada')
          payload=gzip.decompress(base64.b64decode(os.environ['V261_PAYLOAD'])).decode('utf-8')
          s=s.replace(old,new,1)
          marker='</body></html>'
          if marker not in s:
              raise SystemExit('Fechamento HTML não encontrado')
          s=s.replace(marker,payload+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.61
        run: |
          grep -q 'versão 2.61' index.html
          grep -q 'v261HistoryJanJun2026' index.html
          grep -q '8085.36' index.html
          grep -q 'Assinatura Noh' index.html
          grep -q 'Pessoa = Compartilhado' index.html
          grep -q 'Local = Fortaleza' index.html
          python - <<'PY2'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/all-scripts.js').write_text('\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')
          PY2
          node --check /tmp/all-scripts.js
      - name: Publicar V2.61 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v261.yml
          git add index.html .github/workflows/apply-v261.yml
          git commit -m 'V2.61: importar histórico jan-jun 2026'
          git push origin HEAD:main
