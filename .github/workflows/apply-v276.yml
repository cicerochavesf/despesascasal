name: Aplicar V2.76 filtro anual em Analises

"on":
  push:
    paths:
      - '.github/workflows/apply-v276.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar filtro de ano em Analises
        run: |
          echo ' ' | tr -d ' ' | base64 -d > /tmp/v276.py
          python3 /tmp/v276.py
          rm -f .github/workflows/apply-v276.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v276.yml
          git commit -m "V2.76: adiciona filtro de ano em Analises"
          git push
