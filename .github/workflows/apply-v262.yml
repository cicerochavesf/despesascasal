name: Aplicar V2.62

on:
  push:
    paths:
      - '.github/workflows/apply-v262.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.61
        run: test "$(git hash-object index.html)" = "2ad855d01b2e7ca93afae36fb3b7d49a8da8680a"
      - name: Aplicar V2.62
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.61 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.62 -->'
          if old not in s: raise SystemExit('Cabeçalho V2.61 não encontrado')
          if 'v262-mobile-fit-analysis-columns-style' in s: raise SystemExit('V2.62 já aplicada')
          s=s.replace(old,new,1)
          addon=r"""<style id="v262-mobile-fit-analysis-columns-style">
          /* V2.62 — números responsivos no celular e ajuste de colunas nas tabelas de Análises. */
          @media(max-width:760px){
            .v254-kpi,.tx-summary-card,.tx-kpi,.envelope-stat,.v216-glance-item,.v255-kpi,.v260-rank{min-width:0!important;overflow:hidden!important}
            .v254-kpi strong.v254-money{display:flex!important;align-items:flex-end!important;flex-wrap:nowrap!important;gap:4px!important;min-width:0!important;max-width:100%!important}
            .v254-kpi strong.v254-money em{flex:0 0 auto!important;font-size:12px!important}
            .v254-kpi strong.v254-money b{min-width:0!important;max-width:100%!important;font-size:clamp(19px,5.9vw,25px)!important;line-height:.98!important;letter-spacing:-.045em!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important}
            .v254-kpi>strong:not(.v254-money),
            .tx-summary-card strong,.tx-kpi strong,.envelope-stat strong,.v216-glance-item strong,.v255-kpi strong{max-width:100%!important;min-width:0!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important}
            .tx-summary-card strong{font-size:clamp(17px,5.3vw,20px)!important;line-height:1.08!important}
            .envelope-stat strong{font-size:clamp(14px,4.8vw,17px)!important;line-height:1.08!important}
            .v260-rank>strong{min-width:0!important;max-width:100%!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important;text-align:right!important;line-height:1.15!important}
            .v260-delta{max-width:100%!important;white-space:normal!important;text-align:center!important;line-height:1.1!important}
            html.device-mobile .view-rxd .v260-card .column-width-toolbar,
            .view-rxd .v260-card .column-width-toolbar{display:flex!important;min-height:20px!important;margin:2px 0 5px!important;justify-content:flex-end!important}
            .view-rxd .v260-card .column-width-button{font-size:7.5px!important;padding:2px 4px!important;min-height:20px!important;opacity:.56!important}
          }
          .v260-card .column-width-toolbar{margin:2px 0 6px!important;min-height:20px!important}
          .v260-card .column-width-button{font-size:8px!important;padding:2px 5px!important;min-height:21px!important;opacity:.58!important}
          .v260-card .column-width-button:hover{opacity:1!important}
          </style>
          <script id="v262-analysis-column-width-script">
          (function(){
            function v262AnalysisTableKey(card,index,table){
              const title=(card?.querySelector('.v260-card-head h3')?.textContent||'Tabela de análises').trim();
              const headers=[...table.querySelectorAll('thead th')].map(th=>(th.textContent||'').trim());
              const slug=typeof columnKeySlug==='function'?columnKeySlug(title):title.toLowerCase().replace(/[^a-z0-9]+/g,'_');
              const signature=typeof normalizedColumnHeader==='function'?headers.map(normalizedColumnHeader).join('_'):String(index);
              return {key:`rxd_v262_${slug}_${index}__${signature||'tabela'}`,title,headers};
            }
            function v262InitAnalysisColumns(){
              if(typeof ensureUiState!=='function'||typeof columnWidthProfile!=='function')return;
              ensureUiState();
              document.querySelectorAll('.view-rxd .v260-table-wrap').forEach((wrap,index)=>{
                const table=wrap.querySelector('table');
                if(!table)return;
                const card=wrap.closest('.v260-card'),meta=v262AnalysisTableKey(card,index,table),saved=columnWidthProfile()[meta.key];
                table.dataset.columnKey=meta.key;
                table.dataset.columnTitle=meta.title;
                if(saved?.widths?.length&&typeof applyColumnWidthsToTable==='function')applyColumnWidthsToTable(table,saved.widths);
                let toolbar=wrap.previousElementSibling;
                if(!toolbar||!toolbar.classList.contains('column-width-toolbar')){
                  toolbar=document.createElement('div');
                  toolbar.className='column-width-toolbar v262-analysis-column-toolbar';
                  wrap.parentNode.insertBefore(toolbar,wrap);
                }
                const isSaved=!!saved?.widths?.length;
                toolbar.innerHTML=`<button type="button" class="column-width-button ${isSaved?'saved':''}" onclick="openColumnWidthEditor('${encodeURIComponent(meta.key)}')" title="Editar a largura das colunas desta tabela"><svg class="column-width-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 17h16M7 4v6M17 14v6"/></svg>${isSaved?'Larguras salvas':'Ajustar colunas'}</button>`;
              });
            }
            const v262BaseRenderRxD=renderRxD;
            renderRxD=function(){
              v262BaseRenderRxD();
              requestAnimationFrame(()=>requestAnimationFrame(v262InitAnalysisColumns));
            };
          })();
          </script>
          <!-- V2.62 — Correção de overflow numérico no celular e ajuste de colunas em todas as tabelas de Análises. -->"""
          if '</body></html>' not in s: raise SystemExit('Fechamento HTML não encontrado')
          s=s.replace('</body></html>',addon+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.62
        run: |
          grep -q 'versão 2.62' index.html
          grep -q 'v262-mobile-fit-analysis-columns-style' index.html
          grep -q 'v262-analysis-column-width-script' index.html
          grep -q 'v261HistoryJanJun2026' index.html
          grep -q 'v260-analysis-clean-style' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/all-scripts.js').write_text('\\n\\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/all-scripts.js
      - name: Publicar V2.62 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v262.yml
          git add index.html .github/workflows/apply-v262.yml
          git commit -m 'V2.62: corrigir números mobile e colunas em Análises'
          git push origin HEAD:main
