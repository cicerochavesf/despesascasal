name: Aplicar V2.53b

on:
  push:
    paths:
      - '.github/workflows/apply-v253b.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.52
        run: test "$(git hash-object index.html)" = "782715f98df40292b2d9123335093aa91be0723f"
      - name: Aplicar V2.53
        shell: python
        run: |
          from pathlib import Path
          import zlib,base64,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.52 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.53 -->'
          if old not in s: raise SystemExit('Cabeçalho V2.52 não encontrado')
          s=s.replace(old,new,1)
          payload=''
          block=zlib.decompress(base64.b64decode(payload)).decode()
          s=s.replace('</body></html>', block+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
      - name: Validar V2.53
        run: |
          grep -q 'versão 2.53' index.html
          grep -q 'v254-home-clean-style' index.html
          grep -q 'v254HomePanel' index.html
          node --check /tmp/scripts.js
      - name: Publicar V2.53 e limpar workflows temporários
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v253.yml .github/workflows/apply-v253b.yml
          git add index.html .github/workflows/apply-v253.yml .github/workflows/apply-v253b.yml
          git commit -m 'V2.53: limpar painel e integrar filtros'
          git push origin HEAD:main
