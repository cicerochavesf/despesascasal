name: Apply V296 analysis card
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v296-analysis-card.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply V2.96
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.95 -->'
          if old not in t:
              raise SystemExit('V2.95 não encontrada')
          block=base64.b64decode('').decode('utf-8')
          if 'v296-analysis-coming-soon-card-style' not in t:
              t=t.replace('</body>',block+'\n</body>',1)
          t=t.replace(old,'<!-- Despesas Casal - Controle Financeiro | versão 2.96 -->',1)
          p.write_text(t,encoding='utf-8')
          sw=Path('sw.js')
          s=sw.read_text(encoding='utf-8')
          if 'financas-cn-v258' not in s:
              raise SystemExit('cache v258 não encontrado')
          sw.write_text(s.replace('financas-cn-v258','financas-cn-v259',1),encoding='utf-8')
          Path('.github/workflows/apply-v296-analysis-card.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v296-analysis-card.yml
          git commit -m "V2.96: adiciona card visual em Analises"
          git push origin main
