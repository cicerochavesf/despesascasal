name: Aplicar V2.74 seletor de periodo

on:
  push:
    paths:
      - '.github/workflows/apply-v274.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir seta do seletor de periodo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<!-- Despesas Casal - Controle Financeiro | versão 2.73 -->'
          new = '<!-- Despesas Casal - Controle Financeiro | versão 2.74 -->'
          if old not in s:
              raise SystemExit('Cabeçalho da V2.73 não encontrado')
          s = s.replace(old, new, 1)

          css = r'''
<style id="v274-period-chip-arrow-fix">
/* V2.74 — separa a seta do texto e evita sobreposição no nome do mês. */
.v264-movement-period{
  width:max-content!important;
  min-width:max-content!important;
  max-width:none!important;
  overflow:visible!important;
  padding-right:34px!important;
}
.v264-movement-period span{
  width:auto!important;
  min-width:max-content!important;
  max-width:none!important;
  overflow:visible!important;
  white-space:nowrap!important;
  padding-right:2px!important;
}
.v264-movement-period:after{
  content:""!important;
  position:absolute!important;
  width:7px!important;
  height:7px!important;
  right:13px!important;
  top:50%!important;
  border:0!important;
  border-right:2px solid #dbeafe!important;
  border-bottom:2px solid #dbeafe!important;
  transform:translateY(-68%) rotate(45deg)!important;
  pointer-events:none!important;
  box-sizing:border-box!important;
}
@media(max-width:760px){
  .v264-movement-period{
    width:max-content!important;
    min-width:max-content!important;
    max-width:none!important;
    padding:5px 33px 5px 9px!important;
  }
  .v264-movement-period:after{right:12px!important}
}
@media(max-width:360px){
  .v264-movement-period{
    max-width:none!important;
    font-size:8.2px!important;
    padding-right:30px!important;
  }
  .v264-movement-period:after{right:11px!important;width:6px!important;height:6px!important}
}
</style>
'''
          if 'id="v274-period-chip-arrow-fix"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if "CACHE_NAME='financas-cn-v232'" in t:
              t = t.replace("CACHE_NAME='financas-cn-v232'", "CACHE_NAME='financas-cn-v233'", 1)
          sw.write_text(t, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v274.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v274.yml
          git commit -m "V2.74: corrige sobreposição no seletor de período"
          git push
