name: Apply V293 sticky corner
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v293-sticky-corner.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply V2.93
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.92 -->'
          if old not in t: raise SystemExit('V2.92 não encontrada')
          block=base64.b64decode('') .decode('utf-8')
          if 'v293-sticky-corner-subcategory-height-style' not in t:
              t=t.replace('</body>',block+'\n</body>',1)
          t=t.replace(old,'<!-- Despesas Casal - Controle Financeiro | versão 2.93 -->',1)
          p.write_text(t,encoding='utf-8')
          sw=Path('sw.js'); s=sw.read_text(encoding='utf-8')
          if 'financas-cn-v255' not in s: raise SystemExit('cache v255 não encontrado')
          sw.write_text(s.replace('financas-cn-v255','financas-cn-v256',1),encoding='utf-8')
          Path('.github/workflows/apply-v293-sticky-corner.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v293-sticky-corner.yml
          git commit -m "V2.93: corrige cabeçalho congelado e amplia subcategorias"
          git push origin main
