name: Apply V289 columns
'on':
  push:
    paths:
      - .github/workflows/apply-v289-columns.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch column controls
        run: |
          python -c "from pathlib import Path;import base64;p=Path('index.html');s=p.read_text(encoding='utf-8');old='<!-- Despesas Casal - Controle Financeiro | versão 2.88 -->';new='<!-- Despesas Casal - Controle Financeiro | versão 2.89 -->';assert old in s,'V2.88 não encontrada';assert 'v289-column-controls-all-devices-style' not in s,'V2.89 já aplicada';s=s.replace(old,new,1);block=base64.b64decode('').decode('utf-8');s=s.replace('</body>',block+'\n</body>',1);p.write_text(s,encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('sw.js');s=p.read_text(encoding='utf-8');assert \"financas-cn-v251\" in s,'cache v251 não encontrado';p.write_text(s.replace(\"financas-cn-v251\",\"financas-cn-v252\",1),encoding='utf-8')"
          rm -f .github/workflows/apply-v289-columns.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/apply-v289-columns.yml
          git commit -m 'V2.89: habilita ajuste de colunas em todas as visões'
          git push
