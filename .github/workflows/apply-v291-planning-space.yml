name: Apply V291 planning space
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v291-planning-space.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply V2.91
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.90 -->'
          if old not in t: raise SystemExit('V2.90 não encontrada')
          t=t.replace(old,'<!-- Despesas Casal - Controle Financeiro | versão 2.91 -->',1)
          css=zlib.decompress(base64.b64decode('')).decode()
          js=zlib.decompress(base64.b64decode('')).decode()
          if 'v291-planning-space-optimization-style' not in t: t=t.replace('</body>',css+'\n'+js+'\n</body>',1)
          p.write_text(t,encoding='utf-8')
          sw=Path('sw.js'); s=sw.read_text(encoding='utf-8')
          if 'financas-cn-v253' not in s: raise SystemExit('cache v253 não encontrado')
          sw.write_text(s.replace('financas-cn-v253','financas-cn-v254',1),encoding='utf-8')
          Path('.github/workflows/apply-v291-planning-space.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v291-planning-space.yml
          git commit -m "V2.91: otimiza tabelas do Planejamento"
          git push origin main
