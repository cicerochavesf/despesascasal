name: Apply V297 toolbar extrato
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v297-toolbar-extrato.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply V2.97
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_header = '<!-- Despesas Casal - Controle Financeiro | versão 2.96 -->'
          new_header = '<!-- Despesas Casal - Controle Financeiro | versão 2.97 -->'
          if old_header not in s:
              raise SystemExit('V2.96 não encontrada')
          if 'v297-column-toolbar-containment' in s:
              raise SystemExit('V2.97 já aplicada')

          s = s.replace(old_header, new_header, 1)

          pattern = re.compile(
              r"function prepareDefaultOpening\(\)\{\s*"
              r"view='[^']+';\s*"
              r"periodMode='mes';\s*"
              r"state\.month=.*?;\s*"
              r"txScope='mes';\s*"
              r"txPanel='[^']+';",
              re.S
          )
          replacement = """function prepareDefaultOpening(){
            view='lancamentos';
            periodMode='mes';
            state.month=validMonth(typeof v223FinancialMonthForDate==='function'?v223FinancialMonthForDate(localDateId()):currentMonthId());
            txScope='mes';
            txPanel='realizados';"""
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('prepareDefaultOpening não encontrada para ajuste')

          style = r'''
          <style id="v297-column-toolbar-containment">
          /* V2.97 — mantém os controles de largura/colunas contidos no card em todas as visões. */
          html[data-ui="v23"] .table-view-toolbar.v289-column-toolbar,
          html[data-ui="v23"] .view-lancamentos .table-view-toolbar,
          html[data-ui="v23"] .view-despesas .table-view-toolbar{
            width:100%!important;
            max-width:100%!important;
            min-width:0!important;
            box-sizing:border-box!important;
            overflow:hidden!important;
          }
          html[data-ui="v23"] .table-view-toolbar .table-view-toolbar-copy{
            min-width:0!important;
            overflow:hidden!important;
            text-overflow:ellipsis!important;
            white-space:nowrap!important;
          }
          html[data-ui="v23"] .table-view-toolbar .table-view-toolbar-actions{
            min-width:0!important;
            max-width:100%!important;
            box-sizing:border-box!important;
          }
          html[data-ui="v23"] .table-view-toolbar .table-view-toolbar-actions > *,
          html[data-ui="v23"] .table-view-toolbar .column-width-toolbar,
          html[data-ui="v23"] .table-view-toolbar .column-width-button{
            box-sizing:border-box!important;
            max-width:100%!important;
          }
          @media (max-width:1120px){
            html[data-ui="v23"] .view-lancamentos .table-view-toolbar.v289-column-toolbar,
            html[data-ui="v23"] .view-despesas .table-view-toolbar.v289-column-toolbar{
              display:flex!important;
              align-items:center!important;
              justify-content:flex-end!important;
              padding:6px!important;
              margin-left:0!important;
              margin-right:0!important;
              transform:none!important;
            }
            html[data-ui="v23"] .view-lancamentos .v289-column-toolbar .table-view-toolbar-copy,
            html[data-ui="v23"] .view-despesas .v289-column-toolbar .table-view-toolbar-copy{
              display:none!important;
            }
            html[data-ui="v23"] .view-lancamentos .v289-column-toolbar .table-view-toolbar-actions,
            html[data-ui="v23"] .view-despesas .v289-column-toolbar .table-view-toolbar-actions{
              position:static!important;
              inset:auto!important;
              transform:none!important;
              width:100%!important;
              min-width:0!important;
              display:grid!important;
              grid-template-columns:repeat(2,minmax(0,1fr))!important;
              gap:6px!important;
              margin:0!important;
            }
            html[data-ui="v23"] .view-lancamentos .v289-column-toolbar .table-view-toolbar-actions > *,
            html[data-ui="v23"] .view-despesas .v289-column-toolbar .table-view-toolbar-actions > *{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              margin:0!important;
              overflow:hidden!important;
              text-overflow:ellipsis!important;
              white-space:nowrap!important;
            }
          }
          </style>
          <!-- V2.97 — controles de colunas contidos e abertura padrão em Movimentações > Extrato. -->
          '''
          if '</head>' not in s:
              raise SystemExit('Fechamento head não encontrado')
          s = s.replace('</head>', style + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if 'financas-cn-v259' not in t:
              raise SystemExit('Cache v259 não encontrado')
          sw.write_text(t.replace('financas-cn-v259','financas-cn-v260',1), encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'versão 2.97' in s
          assert 'v297-column-toolbar-containment' in s
          assert "view='lancamentos';" in s
          assert "txPanel='realizados';" in s
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/v297.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/v297.js
          grep -q "financas-cn-v260" sw.js
          rm -f .github/workflows/apply-v297-toolbar-extrato.yml
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js .github/workflows/apply-v297-toolbar-extrato.yml
          git commit -m 'V2.97: corrige controles de colunas e abre no Extrato'
          git push origin HEAD:main
