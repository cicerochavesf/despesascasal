name: Aplicar V2.80 data real no novo lancamento

"on":
  push:
    paths:
      - '.github/workflows/apply-v280.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover sobrescrita antiga da data
        run: |
          echo '' | base64 -d > /tmp/patch_v280.py
          python3 /tmp/patch_v280.py
          rm -f .github/workflows/apply-v280.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v280.yml
          git commit -m "V2.80: consolida data real no novo lancamento"
          git push
