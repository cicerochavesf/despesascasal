name: Cleanup V284 final
'on':
  push:
    paths:
      - .github/workflows/cleanup-v284-final.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup final
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo '' | base64 -d > /tmp/cleanup_final.py
          python3 /tmp/cleanup_final.py
          rm -f .github/workflows/cleanup-v284-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.84: limpeza final"
          git pull --rebase origin main
          git push
