name: Aplicar V2.55

on:
  push:
    paths:
      - '.github/workflows/apply-v255.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.54
        run: test "$(git hash-object index.html)" = "e21828dcbef0f8155f45d017b81cdef5d8d259d4"
      - name: Aplicar V2.55
        shell: python
        run: |
          from pathlib import Path
          import zlib,base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.54 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.55 -->'
          if old not in s: raise SystemExit('Cabeçalho V2.54 não encontrado')
          if 'v255-analysis-bi-style' in s: raise SystemExit('V2.55 já aplicada')
          s=s.replace(old,new,1)
          payload=''
          block=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          s=s.replace('</body></html>',block+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.55
        run: |
          grep -q 'versão 2.55' index.html
          grep -q 'v255-analysis-bi-style' index.html
          grep -q 'Diagnóstico financeiro' index.html
          grep -q 'O que explica a mudança' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/all-scripts.js').write_text('\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/all-scripts.js
      - name: Publicar V2.55
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v255.yml
          git add index.html .github/workflows/apply-v255.yml
          git commit -m 'V2.55: reformular tela Análises'
          git push origin HEAD:main
