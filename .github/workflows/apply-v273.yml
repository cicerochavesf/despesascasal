name: Aplicar V2.73 filtro de período

"on":
  push:
    paths:
      - '.github/workflows/apply-v273.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir largura do período
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<!-- Despesas Casal - Controle Financeiro | versão 2.72 -->'
          new = '<!-- Despesas Casal - Controle Financeiro | versão 2.73 -->'
          if old not in s:
              raise SystemExit('Cabeçalho da V2.72 não encontrado')
          s = s.replace(old, new, 1)

          css = r'''
<style id="v273-period-chip-width-fix">
/* V2.73 — o seletor compacto de período cresce conforme o nome do mês. */
.v264-movement-period{
  flex:0 0 auto!important;
  width:max-content!important;
  min-width:max-content!important;
  max-width:none!important;
  overflow:visible!important;
  white-space:nowrap!important;
  padding-left:9px!important;
  padding-right:25px!important;
}
.v264-movement-period span{
  display:block!important;
  width:auto!important;
  min-width:max-content!important;
  max-width:none!important;
  overflow:visible!important;
  text-overflow:clip!important;
  white-space:nowrap!important;
}
.v264-movement-period:after{
  right:8px!important;
}
@media(max-width:760px){
  .v264-movement-hero-head>div:first-child{min-width:0!important;flex:1 1 auto!important}
  .v264-movement-period{
    width:max-content!important;
    min-width:max-content!important;
    max-width:48vw!important;
    padding:5px 23px 5px 8px!important;
    font-size:9px!important;
  }
}
@media(max-width:360px){
  .v264-movement-period{
    max-width:52vw!important;
    font-size:8.2px!important;
    padding-left:7px!important;
    padding-right:21px!important;
  }
}
</style>
'''
          if 'id="v273-period-chip-width-fix"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if "CACHE_NAME='financas-cn-v231'" in t:
              t = t.replace("CACHE_NAME='financas-cn-v231'", "CACHE_NAME='financas-cn-v232'", 1)
          sw.write_text(t, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v273.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v273.yml
          git commit -m "V2.73: corrige largura do seletor de período"
          git push
