name: Apply V284 all period split
'on':
  push:
    paths:
      - .github/workflows/apply-v284-mobile-period.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch all period split
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo '' | base64 -d > /tmp/patch_v284.py
          python3 /tmp/patch_v284.py
          node --check /tmp/v281.js
          rm -f .github/workflows/apply-v284-mobile-period.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.84: Ano e Mes separados em todas as visoes"
          git pull --rebase origin main
          git push
