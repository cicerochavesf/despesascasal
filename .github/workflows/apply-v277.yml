name: Aplicar V2.77 botoes flutuantes

"on":
  push:
    paths:
      - '.github/workflows/apply-v277.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir botoes flutuantes no tablet
        run: |
          echo '' | base64 -d > /tmp/apply_v277.py
          python3 /tmp/apply_v277.py
          rm -f .github/workflows/apply-v277.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v277.yml
          git commit -m "V2.77: restaura botoes flutuantes no tablet"
          git push
