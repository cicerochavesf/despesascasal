name: Apply V287 mobile planning columns
'on':
  push:
    paths:
      - .github/workflows/apply-v287-mobile-planning-columns.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile planning columns
        run: |
          echo '' | base64 -d > /tmp/patch_v287.py
          python3 /tmp/patch_v287.py
          rm -f .github/workflows/apply-v287-mobile-planning-columns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.87: restaura ajuste de colunas no Planejamento mobile"
          git pull --rebase origin main
          git push
