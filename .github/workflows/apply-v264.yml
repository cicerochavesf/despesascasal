name: Aplicar V2.64

on:
  push:
    paths:
      - '.github/workflows/apply-v264.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.63
        run: test "$(git hash-object index.html)" = "57cf19ed43511e735e73c7cf3a23cedf7e683591"

      - name: Aplicar V2.64
        shell: python
        env:
          V264_PAYLOAD: 