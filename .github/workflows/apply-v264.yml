name: Aplicar V2.64

on:
  push:
    paths:
      - '.github/workflows/apply-v264.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.63
        run: test "$(git hash-object index.html)" = "57cf19ed43511e735e73c7cf3a23cedf7e683591"

      - name: Aplicar V2.64
        shell: python
        env:
          V264_PAYLOAD: 
        run: |
          from pathlib import Path
          import base64, gzip, os
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_header='<!-- Despesas Casal - Controle Financeiro | versão 2.63 -->'
          new_header='<!-- Despesas Casal - Controle Financeiro | versão 2.64 -->'
          if old_header not in s:
              raise SystemExit('Cabeçalho V2.63 não encontrado')
          if 'v264-movements-home-open-script' in s:
              raise SystemExit('V2.64 já aplicada')

          old_open="""function prepareDefaultOpening(){
            view='estrategia';
            periodMode='mes';
            state.month=validMonth(currentMonthId());
            txScope='mes';
            txPanel='realizados';"""
          new_open="""function prepareDefaultOpening(){
            view='lancamentos';
            periodMode='mes';
            state.month=validMonth(typeof v223FinancialMonthForDate==='function'?v223FinancialMonthForDate(localDateId()):currentMonthId());
            txScope='mes';
            txPanel='realizados';"""
          if old_open not in s:
              raise SystemExit('prepareDefaultOpening esperado não encontrado')

          addon=gzip.decompress(base64.b64decode(os.environ['V264_PAYLOAD'])).decode('utf-8')
          s=s.replace(old_header,new_header,1)
          s=s.replace(old_open,new_open,1)

          marker='</body></html>'
          if marker not in s:
              raise SystemExit('Fechamento HTML não encontrado')
          s=s.replace(marker,addon+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')

      - name: Validar V2.64
        run: |
          grep -q 'versão 2.64' index.html
          grep -q 'v264-movements-home-open-script' index.html
          grep -q 'v264-movement-hero' index.html
          grep -q 'content:"Colunas"' index.html
          python - <<'PY2'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          expected="""function prepareDefaultOpening(){
            view='lancamentos';
            periodMode='mes';
            state.month=validMonth(typeof v223FinancialMonthForDate==='function'?v223FinancialMonthForDate(localDateId()):currentMonthId());
            txScope='mes';
            txPanel='realizados';"""
          assert expected in s
          scripts='\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/all-scripts.js').write_text(scripts,encoding='utf-8')
          PY2
          node --check /tmp/all-scripts.js

      - name: Publicar V2.64 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v264.yml
          git add index.html .github/workflows/apply-v264.yml
          git commit -m 'V2.64: painel em Movimentações e abertura no Extrato'
          git push origin HEAD:main
