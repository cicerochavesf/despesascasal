name: Aplicar V2.75 tablet

"on":
  push:
    paths:
      - '.github/workflows/apply-v275.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar Movimentacoes no tablet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.74 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.75 -->'
          if old not in s:
              raise SystemExit('Cabeçalho da V2.74 não encontrado')
          s=s.replace(old,new,1)
          css=base64.b64decode('').decode('utf-8')
          if 'id="v275-tablet-movements-responsive"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=t.replace("CACHE_NAME='financas-cn-v233'","CACHE_NAME='financas-cn-v234'",1)
          sw.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v275.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v275.yml
          git commit -m "V2.75: ajusta Movimentacoes para tablet"
          git push
