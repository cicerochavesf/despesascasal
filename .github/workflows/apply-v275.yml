name: Aplicar V2.75 tablet

on:
  push:
    paths:
      - '.github/workflows/apply-v275.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar Movimentacoes no tablet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<!-- Despesas Casal - Controle Financeiro | versão 2.74 -->'
          new = '<!-- Despesas Casal - Controle Financeiro | versão 2.75 -->'
          if old not in s:
              raise SystemExit('Cabeçalho da V2.74 não encontrado')
          s = s.replace(old, new, 1)

          css = r'''
<style id="v275-tablet-movements-responsive">
/* V2.75 — faixa de tablet: quatro guias proporcionais, sem rolagem ou cortes. */
@media (min-width:761px) and (max-width:1120px){
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-tabs{
    display:grid!important;
    grid-template-columns:repeat(4,minmax(0,1fr))!important;
    grid-auto-flow:row!important;
    width:100%!important;
    max-width:100%!important;
    gap:5px!important;
    padding:5px!important;
    margin:10px 0 12px!important;
    overflow:visible!important;
    overflow-x:visible!important;
    scroll-snap-type:none!important;
  }
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-tabs button{
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
    min-height:40px!important;
    padding:8px 5px!important;
    gap:0!important;
    flex:initial!important;
    font-size:clamp(9px,1.2vw,11px)!important;
    line-height:1.1!important;
    letter-spacing:-.015em!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:clip!important;
    scroll-snap-align:none!important;
  }
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-tabs button span{
    display:block!important;
    min-width:0!important;
    max-width:100%!important;
    white-space:nowrap!important;
    overflow:visible!important;
    text-overflow:clip!important;
  }
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-tabs button b{
    display:none!important;
  }
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .v26-movement-toolbar,
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .v27-movement-toolbar{
    display:none!important;
  }
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-summary{
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    grid-auto-flow:row!important;
    grid-auto-columns:auto!important;
    gap:10px!important;
    overflow:visible!important;
  }
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-summary>.card,
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-summary>.metric,
  html[data-ui="v23"] .view-lancamentos .v264-movement-hero .tx-summary>.tx-summary-card{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
  }
}
</style>
'''
          if 'id="v275-tablet-movements-responsive"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = t.replace("CACHE_NAME='financas-cn-v233'", "CACHE_NAME='financas-cn-v234'", 1)
          sw.write_text(t, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v275.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-v275.yml
          git commit -m "V2.75: ajusta Movimentacoes para tablet"
          git push
