name: Validar seletor V2.81
on:
  push:
    paths:
      - '.github/workflows/fix-v281-js.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir e validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad=":')+monthList.map"
          good=":'')+monthList.map"
          if bad in s:
              s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script id="v281-movement-period-split-script">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('Script V2.81 não encontrado')
          Path('/tmp/v281.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v281.js
          python3 - <<'PY'
          from pathlib import Path
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          if 'financas-cn-v241' in t:
              t=t.replace('financas-cn-v241','financas-cn-v242',1)
          elif 'financas-cn-v240' in t:
              t=t.replace('financas-cn-v240','financas-cn-v242',1)
          sw.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-v281-js.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: valida seletor Ano e Mes da V2.81"
          git push
