name: Aplicar V2.70 mobile grid

on:
  push:
    paths:
      - '.github/workflows/apply-v270-mobile-grid.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base atual
        run: test "$(git hash-object index.html)" = "8b40e4db62ca1730dbc8f74f6e7e8f511b372c24"

      - name: Aplicar V2.70
        env:
          V270_ADDON_B64: 
        run: |
          python -c "from pathlib import Path; import os,base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='<!-- Despesas Casal - Controle Financeiro | versão 2.69 -->'; new='<!-- Despesas Casal - Controle Financeiro | versão 2.70 -->'; assert old in s; assert 'v270-mobile-movement-layout-style' not in s; addon=base64.b64decode(os.environ['V270_ADDON_B64']).decode('utf-8'); s=s.replace(old,new,1); closing='</body></html>'; assert closing in s; s=s.replace(closing,'',1).rstrip()+addon+'\n'+closing+'\n'; p.write_text(s,encoding='utf-8')"

      - name: Validar V2.70
        run: |
          grep -q 'versão 2.70' index.html
          grep -q 'v270-mobile-movement-layout-style' index.html
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))!important' index.html
          grep -q 'grid-template-columns:minmax(0,1fr)!important' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); assert s.count('id=\"v270-mobile-movement-layout-style\"')==1; assert s.count('</body></html>')==1; assert s.rstrip().endswith('</body></html>'); scripts='\\n\\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)); Path('/tmp/all-scripts.js').write_text(scripts,encoding='utf-8')"
          node --check /tmp/all-scripts.js

      - name: Publicar e limpar workflows temporários
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v270-mobile-grid.yml
          rm -f .github/workflows/apply-v270.yml
          rm -f .github/workflows/recover-v270-audit.yml
          git add index.html .github/workflows
          git commit -m 'V2.70: corrigir layout mobile de Movimentações'
          git push origin HEAD:main
