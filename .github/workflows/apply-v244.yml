name: Limpar workflow temporário V2.44

on:
  push:
    paths:
      - '.github/workflows/apply-v244.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remover workflow temporário
        shell: bash
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-v244.yml
          git commit -m 'Remover workflow temporário da publicação V2.44'
          git push origin HEAD:main
