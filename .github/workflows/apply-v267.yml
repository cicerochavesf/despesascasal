name: Aplicar V2.67

on:
  push:
    paths:
      - '.github/workflows/apply-v267.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.66
        run: test "$(git hash-object index.html)" = "a613d79b34cf70298a3fe3b19150a7be7031d628"

      - name: Aplicar V2.67
        shell: python
        env:
          V267_PAYLOAD: 
        run: |
          from pathlib import Path
          import base64, gzip, os
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.66 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.67 -->'
          if old not in s:
              raise SystemExit('base inesperada')
          if 'v267-period-chips-style' in s:
              raise SystemExit('V2.67 ja aplicada')
          addon=gzip.decompress(base64.b64decode(os.environ['V267_PAYLOAD'])).decode('utf-8')
          s=s.replace(old,new,1)
          s=s.replace('</body></html>',addon+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')

      - name: Validar V2.67
        run: |
          grep -q 'versão 2.67' index.html
          grep -q 'v267-period-chips-style' index.html
          grep -q 'v267-period-chips-script' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="v267-period-chips-style"') == 1
          assert s.count('id="v267-period-chips-script"') == 1
          scripts='\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/all-scripts.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/all-scripts.js

      - name: Publicar V2.67
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v267.yml
          git add index.html .github/workflows/apply-v267.yml
          git commit -m 'V2.67: mostrar ano e período nos painéis azuis'
          git push origin HEAD:main
