name: Aplicar V2.81 seletor separado
on:
  push:
    paths:
      - '.github/workflows/apply-v281b.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste V2.81
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- Despesas Casal - Controle Financeiro | versão 2.80 -->','<!-- Despesas Casal - Controle Financeiro | versão 2.81 -->',1)
          marker='v281-movement-period-split'
          if marker not in s:
              block=base64.b64decode('').decode('utf-8')
              if '</body>' not in s:
                  raise SystemExit('Fechamento </body> não encontrado')
              s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          if 'financas-cn-v239' in t:
              t=t.replace('financas-cn-v239','financas-cn-v240',1)
          sw.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v281.yml .github/workflows/apply-v281b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.81: separa filtros de ano e mes em Movimentacoes"
          git push
