name: Aplicar V2.58

on:
  push:
    paths:
      - '.github/workflows/apply-v258.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.57
        run: test "$(git hash-object index.html)" = "36007eec7fd81d092a1a48149610c0a3daa8befa"
      - name: Aplicar V2.58
        shell: python
        run: |
          from pathlib import Path
          import zlib, base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<!-- Despesas Casal - Controle Financeiro | versão 2.57 -->'
          new = '<!-- Despesas Casal - Controle Financeiro | versão 2.58 -->'
          if old not in s:
              raise SystemExit('Cabeçalho V2.57 não encontrado')
          if 'v258-home-analysis-fixes-style' in s:
              raise SystemExit('V2.58 já aplicada')
          s = s.replace(old, new, 1)
          payload = ''
          block = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          s = s.replace('</body></html>', block + '\n</body></html>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Validar V2.58
        run: |
          grep -q 'versão 2.58' index.html
          grep -q 'v258-home-analysis-fixes-style' index.html
          grep -q 'Período exibido' index.html
          grep -q 'v258ToggleHomeFilter' index.html
          grep -q 'v258AnalysisFilters' index.html
          grep -q 'Todos' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/all-scripts.js').write_text('\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/all-scripts.js
      - name: Publicar V2.58 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v258.yml
          git add index.html .github/workflows/apply-v258.yml
          git commit -m 'V2.58: corrigir filtros, KPIs e Análises'
          git push origin HEAD:main
