name: Aplicar V2.68

on:
  push:
    paths:
      - '.github/workflows/apply-v268.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.67
        run: test "$(git hash-object index.html)" = "09edec9a0b7732f75b4557d0ebf6577033b2010c"

      - name: Aplicar V2.68
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.67 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.68 -->'
          if old not in s:
              raise SystemExit('Cabeçalho V2.67 não encontrado')
          if 'v268-final-period-kpi-fix-style' in s:
              raise SystemExit('V2.68 já aplicada')

          addon=r'''
<style id="v268-final-period-kpi-fix-style">
/* V2.68 — Correção final: KPIs de Movimentações empilhados no celular e período visível no topo direito. */
.v264-movement-hero .tx-summary .metric{
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  justify-content:center!important;
  text-align:left!important;
}
@media(max-width:760px){
  .v264-movement-hero .tx-summary{
    display:grid!important;
    grid-template-columns:1fr!important;
    gap:7px!important;
    width:100%!important;
    overflow:visible!important;
  }
  .v264-movement-hero .tx-summary .metric{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
  }
}
.v268-home-period-chip{
  position:absolute!important;
  top:14px!important;
  right:14px!important;
  z-index:12!important;
  display:inline-flex!important;
  align-items:center!important;
  gap:7px!important;
  min-height:28px!important;
  padding:5px 9px!important;
  border:1px solid rgba(255,255,255,.16)!important;
  border-radius:999px!important;
  background:rgba(255,255,255,.08)!important;
  color:#fff!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)!important;
  backdrop-filter:blur(8px)!important;
  font-size:9px!important;
  line-height:1!important;
  font-weight:900!important;
  white-space:nowrap!important;
}
.v268-home-period-chip i{
  width:7px!important;height:7px!important;flex:0 0 7px!important;border-radius:50%!important;
  background:#7dd3fc!important;box-shadow:0 0 0 4px rgba(125,211,252,.13)!important;
}
.v268-home-period-chip em{font-style:normal!important;color:#bfdbfe!important;margin:0 2px!important}
.v252-home-hero{position:relative!important}
@media(max-width:430px){
  .v268-home-period-chip{top:10px!important;right:10px!important;font-size:8.5px!important;min-height:26px!important;padding:5px 8px!important}
  .v252-home-hero .v252-hero-copy{padding-top:32px!important}
}
</style>
<script id="v268-final-period-kpi-fix-script">
(function(){
  function v268MonthName(month){
    const raw=String(typeof labelMonth==='function'?labelMonth(month):month||'');
    return raw.replace(/\s*\/\s*\d{4}\s*$/,'').trim();
  }
  function v268PeriodMarkup(year,month){
    return `<i></i><span>${escapeHtml(String(year||''))}<em>·</em>${escapeHtml(v268MonthName(month))}</span>`;
  }

  const v268PrevLancamentos=renderLancamentos;
  renderLancamentos=function(){
    v268PrevLancamentos();
    const chip=document.querySelector('.v264-movement-period');
    if(!chip)return;
    const month=state.month||currentMonthId();
    const year=String(month).slice(0,4);
    chip.innerHTML=txScope==='ano'
      ? `<i></i><span>${escapeHtml(year)}<em>·</em>Ano</span>`
      : v268PeriodMarkup(year,month);
  };

  const v268PrevEstrategia=renderEstrategia;
  renderEstrategia=function(){
    v268PrevEstrategia();
    const hero=document.querySelector('.v246-home-dashboard .v252-home-hero');
    if(!hero)return;
    hero.querySelectorAll('.v267-home-period-chip,.v268-home-period-chip').forEach(el=>el.remove());
    let filters=null;
    try{ if(typeof v246HomeFilters!=='undefined') filters=v246HomeFilters; }catch(_e){}
    const month=(filters&&filters.month&&filters.month!=='todos')?filters.month:(state.month||currentMonthId());
    const year=String((filters&&filters.year)||month||currentMonthId()).slice(0,4);
    const chip=document.createElement('div');
    chip.className='v268-home-period-chip';
    chip.innerHTML=v268PeriodMarkup(year,month);
    chip.setAttribute('aria-label','Período de referência: '+year+' '+v268MonthName(month));
    hero.appendChild(chip);
  };
})();
</script>
<!-- V2.68 — Corrige ordem dos overrides, KPI mobile de Movimentações e mês discreto no Início. -->
'''

          s=s.replace(old,new,1)
          closing='</body></html>'
          if closing not in s:
              raise SystemExit('Fechamento HTML não encontrado')
          s=s.replace(closing,'',1).rstrip()+addon+'\n'+closing+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar V2.68
        run: |
          grep -q 'versão 2.68' index.html
          grep -q 'v268-final-period-kpi-fix-style' index.html
          grep -q 'v268-final-period-kpi-fix-script' index.html
          grep -q 'grid-template-columns:1fr!important' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="v268-final-period-kpi-fix-style"') == 1
          assert s.count('id="v268-final-period-kpi-fix-script"') == 1
          assert s.count('</body></html>') == 1
          assert s.rstrip().endswith('</body></html>')
          scripts='\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/all-scripts.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/all-scripts.js

      - name: Publicar V2.68
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v268.yml
          git add index.html .github/workflows/apply-v268.yml
          git commit -m 'V2.68: corrigir KPIs e período nos painéis'
          git push origin HEAD:main
