name: Aplicar V2.68

on:
  push:
    paths:
      - '.github/workflows/apply-v268.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.67
        run: test "$(git hash-object index.html)" = "09edec9a0b7732f75b4557d0ebf6577033b2010c"

      - name: Aplicar V2.68
        env:
          V268_PAYLOAD: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.67 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.68 -->'
          if old not in s:
              raise SystemExit('Cabeçalho V2.67 não encontrado')
          if 'v268-final-period-kpi-fix-style' in s:
              raise SystemExit('V2.68 já aplicada')
          addon=base64.b64decode(os.environ['V268_PAYLOAD']).decode('utf-8')
          s=s.replace(old,new,1)
          closing='</body></html>'
          if closing not in s:
              raise SystemExit('Fechamento HTML não encontrado')
          s=s.replace(closing,'',1).rstrip()+addon+'\n'+closing+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar V2.68
        run: |
          grep -q 'versão 2.68' index.html
          grep -q 'v268-final-period-kpi-fix-style' index.html
          grep -q 'v268-final-period-kpi-fix-script' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="v268-final-period-kpi-fix-style"') == 1
          assert s.count('id="v268-final-period-kpi-fix-script"') == 1
          assert s.count('</body></html>') == 1
          assert s.rstrip().endswith('</body></html>')
          assert 'grid-template-columns:1fr!important' in s
          scripts='\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/all-scripts.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/all-scripts.js

      - name: Publicar V2.68
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v268.yml
          git add index.html .github/workflows/apply-v268.yml
          git commit -m 'V2.68: corrigir KPIs e período nos painéis'
          git push origin HEAD:main
