name: Apply V282 tablet selection
'on':
  push:
    paths:
      - .github/workflows/apply-v282-tablet-selection.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tablet selection
        run: |
          echo '' | base64 -d > /tmp/patch_v282.py
          python3 /tmp/patch_v282.py
          if [ -f /tmp/v281.js ]; then node --check /tmp/v281.js; fi
          rm -f .github/workflows/apply-v282-tablet-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.82 tablet selection"
          git push
