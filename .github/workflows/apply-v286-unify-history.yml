name: Apply V286 unify history
'on':
  push:
    paths:
      - .github/workflows/apply-v286-unify-history.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply historical identity migration
        run: |
          echo '' | base64 -d > /tmp/patch_v286.py
          python3 /tmp/patch_v286.py
          node --check /tmp/v286.js
          rm -f .github/workflows/apply-v286-unify-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.86: unifica historico jan-jun pela regra de jul-dez"
          git pull --rebase origin main
          git push
