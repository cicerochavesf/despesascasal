name: Aplicar V2.52

on:
  push:
    paths:
      - '.github/workflows/apply-v252.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.51
        run: test "$(git hash-object index.html)" = "4b98dc28eb3687249be5b00d667b68f68afe1865"
      - name: Aplicar V2.52
        shell: python
        run: |
          from pathlib import Path
          import zlib,base64,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v253-home-consolidated-style' in s:
              raise SystemExit('V2.52 já aplicada')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.51 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.52 -->'
          if old not in s:
              raise SystemExit('Cabeçalho V2.51 não encontrado')
          s=s.replace(old,new,1)
          payload=''
          block=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          s=s.replace('</body></html>',block+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.52
        run: |
          grep -q 'versão 2.52' index.html
          grep -q 'v253-home-consolidated-style' index.html
          grep -q 'Início com KPIs integrados ao hero' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/all-scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          print('scripts',len(scripts))
          PY
          node --check /tmp/all-scripts.js
      - name: Publicar V2.52 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v252.yml
          git add index.html .github/workflows/apply-v252.yml
          git commit -m 'V2.52: integrar KPIs e filtros no Início'
          git push origin HEAD:main
