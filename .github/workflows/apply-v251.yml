name: Aplicar V2.51

on:
  push:
    paths:
      - '.github/workflows/apply-v251.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.49
        run: test "$(git hash-object index.html)" = "a67ffd51f6b02b9f7868d1f157ef5d76539f5f36"
      - name: Aplicar V2.51
        shell: python
        run: |
          from pathlib import Path
          import base64,zlib
          payload=""
          block=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.49 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.51 -->'
          if old not in s or 'v250-home-matrices-style' in s:
              raise SystemExit('Base inesperada para V2.51')
          s=s.replace(old,new,1)
          s=s.replace('</body></html>',block+'\n\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.51
        run: |
          grep -q 'versão 2.51' index.html
          grep -q 'Visão mensal por categorias' index.html
          grep -q 'Visão mensal por subcategorias' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('function v250HomeMatrices')
          frag=s[start:start+450]
          a=frag.index("v250Panel('cat'")
          b=frag.index("v250Panel('sub'")
          assert a < b
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/all-scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/all-scripts.js
      - name: Publicar V2.51 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v251.yml
          git add index.html .github/workflows/apply-v251.yml
          git commit -m 'V2.51: adicionar visões mensais por categoria e subcategoria'
          git push origin HEAD:main
