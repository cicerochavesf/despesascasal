name: Aplicar V2.51

on:
  push:
    paths:
      - '.github/workflows/apply-v251.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Conferir base V2.50
        run: test "$(git hash-object index.html)" = "e0911734ff87b6c0ca1915e2ab5d0891fe2f3e5a"
      - name: Aplicar V2.51
        shell: python
        run: |
          from pathlib import Path
          import zlib,base64,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v251-home-refresh-style' in s:
              raise SystemExit('V2.51 já aplicada')
          old='<!-- Despesas Casal - Controle Financeiro | versão 2.50 -->'
          new='<!-- Despesas Casal - Controle Financeiro | versão 2.51 -->'
          if old not in s:
              raise SystemExit('Cabeçalho V2.50 não encontrado')
          s=s.replace(old,new,1)
          payload=''
          block=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          s=s.replace('</body></html>',block+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar V2.51
        run: |
          grep -q 'versão 2.51' index.html
          grep -q 'v251-home-refresh-style' index.html
          grep -q 'Filtros inteligentes' index.html
          grep -q 'Mostrar filtros' index.html
          python - <<'PY2'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/all-scripts.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          assert len(scripts)>=25
          PY2
          node --check /tmp/all-scripts.js
      - name: Publicar V2.51 e limpar workflow temporário
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v251.yml
          git add index.html .github/workflows/apply-v251.yml
          git commit -m 'V2.51: renovar tela Início no celular'
          git push origin HEAD:main
