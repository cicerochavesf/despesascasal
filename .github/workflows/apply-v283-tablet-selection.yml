name: Apply V283 tablet selection
'on':
  push:
    paths:
      - .github/workflows/apply-v283-tablet-selection.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tablet selection
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo '' | base64 -d > /tmp/patch_v283.py
          python3 /tmp/patch_v283.py
          sed -E -i 's/financas-cn-v[0-9]+/financas-cn-v244/' sw.js
          rm -f .github/workflows/apply-v283-tablet-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V2.83: corrige selecao e somatorio do Extrato no tablet"
          git pull --rebase origin main
          git push
