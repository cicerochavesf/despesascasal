name: Aplicar V2.69

on:
  push:
    paths:
      - '.github/workflows/apply-v269.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir base V2.68
        run: test "$(git hash-object index.html)" = "15e62c5ea8133f8dc73dbdadb2043ddbc864180d"

      - name: Aplicar V2.69
        env:
          V269_PATCH_GZ_B64: 
        run: |
          python -c "import os,base64,gzip,pathlib; pathlib.Path('/tmp/apply_v269.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['V269_PATCH_GZ_B64'])))"
          python /tmp/apply_v269.py

      - name: Validar V2.69
        run: |
          grep -q 'versão 2.69' index.html
          grep -q 'v269-real-kpi-period-fix-style' index.html
          grep -q 'v269-real-kpi-period-fix-script' index.html
          grep -q '.v246-home-dashboard .v253-hero-kpis.v269-mobile-kpi-stack' index.html
          grep -q '.v264-movement-hero .tx-summary.v269-mobile-kpi-stack' index.html
          ! grep -q 'v268-final-period-kpi-fix-style' index.html
          ! grep -q 'v268-final-period-kpi-fix-script' index.html
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); assert s.count('id=\"v269-real-kpi-period-fix-style\"')==1; assert s.count('id=\"v269-real-kpi-period-fix-script\"')==1; assert s.count('</body></html>')==1; assert s.rstrip().endswith('</body></html>'); assert \"selectedMonth&&selectedMonth!=='todos'\" in s; scripts='\\n\\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)); Path('/tmp/all-scripts.js').write_text(scripts,encoding='utf-8')"
          node --check /tmp/all-scripts.js

      - name: Publicar V2.69
        run: |
          git config user.name 'ChatGPT App Despesas Casal'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v269.yml
          git add index.html .github/workflows/apply-v269.yml
          git commit -m 'V2.69: corrigir KPIs e período nos painéis'
          git push origin HEAD:main
